  <style>
    :root {
      --bg:       #f7f2ec;   /* warm ivory */

      --accent:   #8a3b5c;   /* deep plum-rose */

      --line:     rgba(42, 23, 41, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #1c121c;
        --text:     #f3e9e2;
        --muted:    #b9a7b2;
        --accent:   #e9c9a8;  /* soft sand */

        --line:     rgba(243, 233, 226, 0.16);

    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image: radial-gradient(ellipse at 15% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%);
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
      line-height: 1.5;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 4rem);
    }

    .wrap {
      width: 100%;
      max-width: 40rem;
    }

    .mark {
      width: 3rem;
      height: 3px;
      background: var(--accent);
      border: 0;
      margin-bottom: 2rem;
      transform-origin: left;
      animation: grow 0.9s ease both 0.15s;
    }
    @keyframes grow { from { transform: scaleX(0); } }

    h1 {
      font-family: "DM Serif Display", Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 6.25rem);
      line-height: 0.95;
      letter-spacing: -0.01em;
    }

    .role {
      font-family: "DM Serif Display", Georgia, serif;
      font-style: italic;
      font-size: clamp(1.15rem, 3.6vw, 1.5rem);
      color: var(--muted);
      margin-top: 1.25rem;
    }

    .links {
      margin-top: 2.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1.5px solid var(--accent);
      padding-bottom: 2px;
      transition: color 0.2s ease;
    }
    .link svg { width: 1.05em; height: 1.05em; fill: var(--accent); }
    .link .go { color: var(--accent); transition: transform 0.25s ease; }
    .link:hover, .link:focus-visible { color: var(--accent-2); outline: none; }
    .link:hover .go, .link:focus-visible .go { transform: translate(2px, -2px); }

    @media (prefers-reduced-motion: reduce) {
      .mark { animation: none; }
      .link, .link .go { transition: none; }
    }
  </style>
